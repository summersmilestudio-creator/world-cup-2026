<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:512px;height:512px;overflow:hidden}
  .ic{width:512px;height:512px;position:relative;
    background:linear-gradient(150deg,#1e9e54 0%,#137a3e 55%,#0c5e2f 100%);
    display:flex;align-items:center;justify-content:center}
  /* pitch lines */
  .pitch{position:absolute;inset:0}
  .circle{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;
    border:6px solid rgba(255,255,255,.18);border-radius:50%}
  .midline{position:absolute;left:0;top:50%;width:100%;height:6px;margin-top:-3px;background:rgba(255,255,255,.18)}
  /* soccer ball */
  .ball{width:300px;height:300px;border-radius:50%;position:relative;z-index:2;
    background:radial-gradient(circle at 38% 32%,#ffffff,#e9eef2 60%,#cfd8dd 100%);
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset -16px -22px 40px rgba(0,0,0,.15)}
  .p{position:absolute;background:#15151c;clip-path:polygon(50% 0,95% 35%,78% 90%,22% 90%,5% 35%)}
  .pc{width:96px;height:90px;left:102px;top:96px}
  .p1{width:62px;height:58px;left:30px;top:60px;transform:rotate(-12deg);opacity:.92}
  .p2{width:62px;height:58px;right:30px;top:60px;left:auto;transform:rotate(12deg);opacity:.92}
  .p3{width:62px;height:58px;left:60px;bottom:34px;top:auto;transform:rotate(150deg);opacity:.92}
  .p4{width:62px;height:58px;right:60px;bottom:34px;left:auto;top:auto;transform:rotate(-150deg);opacity:.92}
  .seam{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(0,0,0,.06)}
</style></head><body>
  <div class="ic">
    <div class="pitch"><div class="midline"></div><div class="circle"></div></div>
    <div class="ball">
      <div class="p pc"></div>
      <div class="p p1"></div><div class="p p2"></div>
      <div class="p p3"></div><div class="p p4"></div>
      <div class="seam"></div>
    </div>
  </div>
</body></html>
